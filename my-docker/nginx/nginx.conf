# WeKnora 接入层（111 站点专属）—— 两个前端的 HTTPS/WSS 统一入口
#
# 对外（全部 TLS，共用同一张证书；证书 SAN 含 IP，与端口无关）：
#   https://10.168.1.111/         → 官方前端
#   https://10.168.1.111:41200/   → 官方前端
#   https://10.168.1.111:41280/   → 定制前端（源码在仓库根的 my-frontend/）
#
# 对内（**同一个容器组内的 service 名**，由 Docker 内置 DNS 解析）：
#   frontend:80      → 官方前端容器（WeKnora-frontend）
#   frontend-wkj:80  → 定制前端容器（WeKnora-frontend-wkj）
#   （两个前端容器另有只绑宿主回环的 41211 / 41212，仅供诊断直连，本层不走那条路）
#
# ★ 为什么前端容器让出对外端口：
#   41200 这一个端口不能既是 http 又是 https。要让本层在 41200 上提供 https，
#   内层前端就必须让出它 ⇒ 内层只绑回环，对外只剩本层一个入口。
#   ⇒ "没有 http 前端端口"是结构上的事实，不是约定。
#
# 为什么需要本层（而不是直接用容器暴露的 http）：
#   BrowserSkill 配对要求非 localhost 必须走 wss
#   —— `internal/browserskill/manager.go` 的 `pairingEndpoint()`：
#        local := hostname ∈ {localhost, 127.0.0.1, ::1}
#        if scheme != "wss" && (!local || scheme != "ws")
#            → "BrowserSkill public URL requires WSS"
#   以 http://<内网IP>:41200 访问时，前端把页面 origin 交给后端推导（http→ws），
#   因 hostname 不是 localhost 而被拒。上游立场见 `.env.example` 的
#   BROWSERSKILL_PUBLIC_URL 段（用段名定位；原写的行号 :779 已漂到 785）
#   「远程部署必须使用 WSS（包括内网）」与 `website-docs/05-clients/09-local-browser.md`
#   「WSS 可以使用企业 CA，无需公网；远程明文 WS 不受支持」。
#
# 为什么本层也要转发 Upgrade：
#   内层 frontend/nginx.conf:135-153 已配好 local-browser 的 WebSocket 转发，
#   但请求必须先经过本层 —— 本层若不转发 Upgrade 头，内层根本收不到升级请求。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 两个前端在容器组内的地址（用 service 名，只在一处定义，便于以后调整）
# 注意：本容器与两个前端同属一个 compose 项目，因此这里能用 service 名解析；
#       若将来把本层拆成独立编排，需改回宿主回环地址。
upstream weknora_official { server frontend:80; }
upstream weknora_custom   { server frontend-wkj:80; }

# ── 官方前端：443（不带端口的便捷入口）+ 41200 ────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    listen      41200 ssl;
    server_name _;                      # catch-all：内网按 IP 访问，不做 Host 白名单

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ★ 刻意不开 HSTS。自签证书场景下，一旦证书被系统取消信任，
    #   HSTS 会把浏览器锁死在 https，导致连"退回直连排查"都做不到。
    #   确认长期稳定后再考虑。

    # 上传上限放宽，避免本层先于内层报 413。
    # 真正的限制仍由内层按 location 决定（frontend/nginx.conf:181 有说明）。
    client_max_body_size 512m;

    location / {
        proxy_pass http://weknora_official;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket —— BrowserSkill wss 依赖这两行
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连：与内层对 local-browser 的设置（3600s）保持一致
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}

# ── 定制前端（my-frontend）：41280 ────────────────────────────────────────
server {
    listen      41280 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 同样不开 HSTS（理由见上）

    client_max_body_size 512m;

    location / {
        proxy_pass http://weknora_custom;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # 定制前端同样要能走 BrowserSkill 配对（wss），故同样转发 Upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
