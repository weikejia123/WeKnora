# 定制前端（wkj）的独立编排 —— 与官方前端并行运行，端口不同
#
# 组成：
#   · 源码：仓库根的 `my-frontend/` —— 官方 `frontend/` 的**逐字副本**
#     （复制于 2026-09-21，770 文件，`diff -r frontend my-frontend` 零差异）
#   · 编排：本文件。**刻意放在 my-docker/ 下而不放进副本目录**，
#     这样 `my-frontend/` 永远保持"能与官方逐字 diff"的纯净状态 —— 那是以后合并的基准。
#     （本目录与 my-docker/tls/ 同构，都属于"站点编排"，不并入 my-docker/docker-compose.yml，
#       因为那份的定位是「官方副本 + 最小定制」，要与官方逐行可比对。）
#
# 与官方前端的差异**全部在编排层**，副本源码一个字节都没改：
#
#   | 项 | 官方 | 本副本 |
#   |---|---|---|
#   | 镜像 tag | wechatopenai/weknora-ui | **wechatopenai/weknora-ui-wkj** |
#   | 容器名 | WeKnora-frontend | **WeKnora-frontend-wkj** |
#   | 宿主端口 | 41200（FRONTEND_PORT） | **41202（MY_FRONTEND_PORT）** |
#   | 构建上下文 | ./frontend | **../../my-frontend** |
#
# 用法（在 111 的仓库根 /mnt/data/weknora）：
#   docker compose -f my-docker/frontend-wkj/docker-compose.yml build   # 首次/改代码后
#   docker compose -f my-docker/frontend-wkj/docker-compose.yml up -d
#   docker compose -f my-docker/frontend-wkj/docker-compose.yml logs -f
#   docker compose -f my-docker/frontend-wkj/docker-compose.yml down    # 不影响官方前端
#
# ★ 与主编排的关系：本文件**不启停 app**（app 由 my-docker/docker-compose.yml 管理），
#   跨编排无法声明 depends_on ⇒ 启动前请确认 app 已在运行。

# ★ 独立项目名：不写的话会从 .env 的 COMPOSE_PROJECT_NAME 继承成 `weknora`，
#   使副本被归入主编排的项目（容器标签 com.docker.compose.project 相同）。
#   独立命名后归属清晰，也避免将来任何"按项目批量操作"误伤它。
#   （网络是显式 external，因此独立项目名不影响反代到 app。）
#
# ⚠️ 生效前提：**运行时不要传 `--env-file .env`**。
#   Compose 的项目名优先级为 `-p` > `COMPOSE_PROJECT_NAME` > 本字段 > 目录名，
#   而主编排的 .env 里有 COMPOSE_PROJECT_NAME=weknora ⇒ 一旦传了它，本字段被覆盖
#   （实测确认）。本文件内所有变量都写了与站点一致的默认值，不依赖主编排的 .env。
name: weknora-frontend-wkj

services:
  frontend-wkj:
    # ★ 独立镜像 tag：绝不能与官方共用 wechatopenai/weknora-ui，
    #   否则 pull / build 会与官方镜像互相静默覆盖
    #   （该风险已在 deploy/deploy-wkj-dev.sh 里针对 app/ui 处理过，这里从源头避免）。
    image: wechatopenai/weknora-ui-wkj:${WEKNORA_VERSION:-latest}

    build:
      # 相对本 compose 文件所在目录 ⇒ 仓库根的 my-frontend/
      context: ../../my-frontend
      args:
        VITE_FRONTEND_COMMIT: ${VITE_FRONTEND_COMMIT:-unknown}
        # 国内构建走镜像源（与 my-docker 的站点值一致）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4096}

    container_name: WeKnora-frontend-wkj

    ports:
      # 官方前端 41200 · app 41201 · 本副本 41202
      - "${MY_FRONTEND_PORT:-41202}:80"

    environment:
      # docker-entrypoint.sh 会把这些写进 config.js 与 nginx 配置
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      # 反代目标：与官方 frontend 同款写法，直连主编排里的 app 容器（8080）。
      # 若哪天解析不到 `app`，可改成容器名 WeKnora-app（两者都走 Docker 内置 DNS）。
      - APP_HOST=${APP_HOST:-app}
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}

    networks:
      # 与主编排共用同一网络 ⇒ 才能反代到 app。
      # 网络名由主编排固定为 weknora_WeKnora-network；主编排改网络名时这里要同步。
      - WeKnora-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

networks:
  WeKnora-network:
    external: true
    name: weknora_WeKnora-network
