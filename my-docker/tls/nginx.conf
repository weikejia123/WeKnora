# WeKnora TLS 终端（111 站点专属）
#
# 职责：浏览器  --https/wss-->  本容器  --http/ws-->  127.0.0.1:41200（frontend nginx）
#
# 为什么需要它：
#   BrowserSkill 配对要求非 localhost 必须走 wss
#   —— `internal/browserskill/manager.go:178-190`：
#        local := hostname ∈ {localhost, 127.0.0.1, ::1}
#        if scheme != "wss" && (!local || scheme != "ws") → "BrowserSkill public URL requires WSS"
#   以 http://<内网IP>:41200 访问时，前端把页面 origin 交给后端推导（http→ws），
#   因 hostname 不是 localhost 而被拒。上游立场见 `.env.example:779`
#   「远程部署必须使用 WSS（包括内网）」与 `docs/browser-skill-production.md:88`
#   「WSS 可以使用企业 CA，无需公网；远程明文 WS 不受支持」。
#
# 为什么本层也要转发 Upgrade：
#   内层 frontend/nginx.conf:135-153 已配好 local-browser 的 WebSocket 转发，
#   但请求必须先经过本层 —— 本层若不转发 Upgrade 头，内层根本收不到升级请求。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name _;                      # catch-all：内网按 IP 访问，不做 Host 白名单

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ★ 刻意不开 HSTS。自签证书场景下，一旦证书被系统取消信任，
    #   HSTS 会把浏览器锁死在 https，导致连"退回直连 41200 排查"都做不到。
    #   确认长期稳定后再考虑。

    # 上传上限放宽，避免本层先于内层报 413。
    # 真正的限制仍由内层按 location 决定（frontend/nginx.conf:181 有说明）。
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:41200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket —— BrowserSkill wss 依赖这两行
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连：与内层对 local-browser 的设置（3600s）保持一致
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
