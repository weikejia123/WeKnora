# ==============================================================================
# my-docker/docker-compose.overlay.yml —— 站点叠加层（wkj 分支的容器组定义）
#
# ★ 部署形态：**一个容器组**。本文件不是"另一套编排"，而是官方编排之上的**增量**；
#   两份文件合并后属于**同一个 project、同一个容器组**，一次 up -d 起停全部。
#
#   用法（缺一不可，务必两份一起给）：
#     docker compose --project-directory <仓库根> --env-file .env \
#       -f docker-compose.yml -f my-docker/docker-compose.overlay.yml up -d
#   （部署脚本已封装，平时用 ./deploy/deploy-wkj-dev.sh 即可）
#
# ★ 为什么用「基底 + 叠加」而不是"复制一份官方 compose 再改"
#   合并语义与复制等价，但官方 docker-compose.yml 得以**一字不动**：
#     · 上游更新 compose（新增 service / 新增变量）时，我们**自动继承**；
#     · 我们的全部定制集中在本文件这一处，不会散落；
#     · 也不存在"副本悄悄过期"的问题。
#   实测合并规则（本机 compose v5.1.2 / 111 v5.5.1 均验证）：
#     · 映射字段（build.args、environment）按键合并 ⇒ 只写要改/加的键
#     · 序列字段（ports、volumes）默认**追加** ⇒ 若要替换必须用 `!override`
#     · 标量字段（image、command）覆盖
#
# ★ 容器组清单（合并后，均为 wkj-dev 分支源码构建）
#     postgres · redis · docreader · app · frontend   ← 官方基底定义（本文件只改各自的定制项）
#     frontend-wkj                                    ← 本文件新增（定制前端，源码 my-frontend/）
#     nginx                                           ← 本文件新增（接入层）
#
# ★ 对外端口
#     443    → nginx → 官方前端（便捷入口，免带端口）
#     41200  → nginx → 官方前端
#     41280  → nginx → 定制前端
#     41201  → app（后端 API，仍是 http，未纳入 TLS）
#   两个前端容器本身**只绑宿主回环** 14100 / 14102（仅供诊断），对外一律经 nginx。
#   ⇒ "没有 http 前端端口"是结构上的事实，不是约定。
#
# ★ 与官方 docker-compose.yml 的实际差异（非注释的实体改动，同步上游时按此比对）
#     1. frontend.ports           41200:80            → 127.0.0.1:14100:80（!override）
#     2. frontend.build.args      NPM_REGISTRY 默认空 → npmmirror
#     3. app.build.args           +GOPROXY_ARG / GOSUMDB_ARG
#     4. app.build.args           +VERSION_ARG / COMMIT_ID_ARG / BUILD_TIME_ARG
#     5. app.build.args           +RUSTUP_DIST_SERVER_ARG / RUSTUP_UPDATE_ROOT_ARG
#     6. app/docreader.build.args +GH_PROXY
#     7. app.build.args           +NPM_REGISTRY_ARG
#     8. app.build.args           +CARGO_REGISTRY_ARG
#     9. docreader.build.args     APT_MIRROR 默认空 → https://mirrors.tencent.com
#    10. +service frontend-wkj / +service nginx
#   ⇒ 用 `./deploy/deploy-wkj-dev.sh compose-diff` 可随时复核。
#
# ★ 注意：官方 compose 里的 `${FRONTEND_PORT}` 已被第 1 条 `!override` 覆盖，
#   即 .env 中该变量的旧值（41200）**不再生效**。对外端口以本文件的 nginx 为准。
# ==============================================================================
services:

  # ──────────────────────────────────────────────────────────────── 官方前端
  frontend:
    # 让出对外端口：一个端口不能既是 http 又是 https，而 41200 要由 nginx 提供 TLS。
    # 改为只绑宿主回环（诊断可直接 curl 127.0.0.1:14100，绕过接入层）。
    ports: !override
      - "127.0.0.1:14100:80"

    build:
      args:
        # [差异 2] 官方默认空 ⇒ registry.npmjs.org（国内不可达）；默认走 npmmirror
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

  # ─────────────────────────────────────── 定制前端（源码 my-frontend/）
  # my-frontend/ 是官方 frontend/ 的**逐字副本**（已同步至官方 main `cc82e75c`，
  # `diff -r frontend my-frontend` 零差异）—— 保持逐字是为了以后与上游合并时，
  # diff 所见即"我们刻意的改动量"，没有噪声。定制全在本文件这一层。
  # ★ 每次上游同步后都要跟一次副本同步，否则上述判据会失效（2026-09-21 实测：
  #   上游一轮更新即产生 66 项差异，且全部来自官方演进）。
  frontend-wkj:
    # ★ 独立镜像 tag：绝不能与官方共用 wechatopenai/weknora-ui，
    #   否则 pull / build 会互相静默覆盖（该风险已在本脚本里针对 app/ui 处理过，这里从源头避免）。
    image: wechatopenai/weknora-ui-wkj:${WEKNORA_VERSION:-latest}
    build:
      context: ./my-frontend
      args:
        VITE_FRONTEND_COMMIT: ${VITE_FRONTEND_COMMIT:-unknown}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4096}
    container_name: WeKnora-frontend-wkj

    ports:
      # 与官方前端同样只绑回环（见上）
      - "127.0.0.1:14102:80"

    environment:
      # docker-entrypoint.sh 把这些写进 config.js 与内层 nginx 配置
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}

    # 与官方 frontend 同款：同一 project 内可以声明 depends_on
    depends_on:
      app:
        condition: service_healthy

    networks:
      - WeKnora-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # ──────────────────────────────────────────────── 接入层（HTTPS/WSS 入口）
  # 两个前端的统一入口。配置资产在 my-docker/nginx/（nginx.conf、gen-certs.sh、README）。
  # 为什么需要它：BrowserSkill 配对要求非 localhost 必须走 wss
  #   —— internal/browserskill/manager.go 的 WSS 校验；上游 .env.example 的
  #      BROWSERSKILL_PUBLIC_URL 段（同样刻意不写行号，理由见下方 app 段注释）
  #   「远程部署必须使用 WSS（包括内网）」。
  nginx:
    image: nginx:1.30.3-alpine
    container_name: weknora-nginx

    ports:
      - "443:443"       # 官方前端的便捷入口（免带端口）
      - "41200:41200"   # 官方前端
      - "41280:41280"   # 定制前端

    volumes:
      - ./my-docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书只存在于宿主磁盘（不进 git）：私钥绝不能入库
      # 目录名 /mnt/data/weknora-tls 刻意保留历史名 —— 改名会让人误以为要重新生成，
      # 而重新生成会作废访问端已导入的 CA 信任。
      - /mnt/data/weknora-tls:/etc/nginx/tls:ro

    # 同 project 内可声明依赖（跨编排时做不到，这正是合并成一个容器组的收益之一）
    depends_on:
      - frontend
      - frontend-wkj

    networks:
      - WeKnora-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # ───────────────────────────────────────────── 后端：构建期站点适配（国内网络）
  app:
    build:
      args:
        # 官方 compose 未 wire 这两个 ARG（Dockerfile.app 已声明）⇒ Go 会回落到
        # proxy.golang.org（国内不可达）；仓库无 vendor/，此参数是硬需求。
        - GOPROXY_ARG=${GOPROXY_ARG:-https://goproxy.cn,direct}
        - GOSUMDB_ARG=${GOSUMDB_ARG:-off}
        # 注入构建版本 → 二进制内嵌 commit，可经 GET /api/v1/system/info 的
        # commit_id 查证"111 上跑的到底是哪一版"（不必再用日志行号反推）。
        # 生效链路：这些 ARG 在 builder 阶段由 ARG 转成 ENV（见 Dockerfile.app 的 builder 段）
        #   → Makefile 里 COMMIT_ID 的赋值段取 `${COMMIT_ID:-unknown}`
        #   → 同段 LDFLAGS 的 `-X ...handler.CommitID` 写入二进制。
        # 注：此处刻意**不写行号** —— 行号会随上游插行而静默失效（2026-09-21 合并时
        #     实测 3 处引用全偏），改用段名定位。
        # 注意 .dockerignore 排除了 .git/ ⇒ VERSION 的 git describe 必然失败，
        # 只能靠 VERSION_ARG 兜底，所以必须传。值由部署脚本按当前 git 状态注入。
        - VERSION_ARG=${WKJ_BUILD_VERSION:-unknown}
        - COMMIT_ID_ARG=${WKJ_BUILD_COMMIT:-unknown}
        - BUILD_TIME_ARG=${WKJ_BUILD_TIME:-unknown}
        # Rust 工具链下载源：官方 static.rust-lang.org 本网络实测 ~36KB/s
        # （工具链约 300MB ⇒ 2 小时），国内镜像 >1MB/s（快约 50 倍）。
        # 配合 Dockerfile.app 新增的中性 ARG（留空即回落官方行为）。
        # 备选：https://mirrors.ustc.edu.cn/rust-static（rustup 路径 /rustup）
        - RUSTUP_DIST_SERVER_ARG=${RUSTUP_DIST_SERVER_ARG:-https://rsproxy.cn}
        - RUSTUP_UPDATE_ROOT_ARG=${RUSTUP_UPDATE_ROOT_ARG:-https://rsproxy.cn/rustup}
        # GitHub 访问加速前缀：直连本网络实测 0~40KB/s 且常中断
        # （release 下载报 HTTP2 错、git clone 直接失败），反代实测 ~271KB/s 且支持 git 协议。
        # 内容可信性：下载产物 sha256 与官方三方交叉验证值一致。
        # 用于本服务 browserskill 阶段的 git clone（insteadOf 改写）。
        # 备选：https://ghfast.top/
        - GH_PROXY=${GH_PROXY:-https://gh-proxy.com/}
        # browserskill 阶段 `npx --yes pnpm@… install` 用
        - NPM_REGISTRY_ARG=${NPM_REGISTRY_ARG:-https://registry.npmmirror.com}
        # browserskill / builder 阶段 cargo 编译走 sparse 索引镜像（留空即官方 crates.io）
        # 备选：sparse+https://mirrors.ustc.edu.cn/crates.io-index/
        - CARGO_REGISTRY_ARG=${CARGO_REGISTRY_ARG:-sparse+https://rsproxy.cn/index/}

  docreader:
    build:
      args:
        # ★ 取值语义（踩过一次）：Dockerfile.docreader 的 sed 替换的是**带 scheme 的 base、
        #   不含路径**，而 debian.sources 本身已带 /debian 与 /debian-security。
        #   所以只能给 `https://mirrors.tencent.com`；写成 `.../debian` 会拼成
        #   `/debian/debian` → apt 404 → 构建失败（exit 100）。
        - APT_MIRROR=${APT_MIRROR:-https://mirrors.tencent.com}
        # 本服务用于 protoc 与 grpc_health_probe 两处 release 下载（同一旋钮，见 app 段）。
        # （protoc 另有更优路径：预置到 packages/ 走 Dockerfile 自带离线分支，
        #   由部署脚本 _ensure_build_artifacts 处理）
        - GH_PROXY=${GH_PROXY:-https://gh-proxy.com/}
