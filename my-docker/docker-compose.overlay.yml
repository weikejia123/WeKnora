# ==============================================================================
# my-docker/docker-compose.overlay.yml —— 站点叠加层（wkj 分支的容器组定义）
#
# ★ 部署形态：**一个容器组**。本文件不是"另一套编排"，而是官方编排之上的**增量**；
#   两份文件合并后属于**同一个 project、同一个容器组**，一次 up -d 起停全部。
#
#   用法（缺一不可，务必两份一起给）：
#     docker compose --project-directory <仓库根> --env-file .env \
#       -f docker-compose.yml -f my-docker/docker-compose.overlay.yml up -d
#   （部署脚本已封装，平时用 ./deploy/deploy-wkj-dev.sh 即可）
#
# ★ 为什么用「基底 + 叠加」而不是"复制一份官方 compose 再改"
#   合并语义与复制等价，但官方 docker-compose.yml 得以**一字不动**：
#     · 上游更新 compose（新增 service / 新增变量）时，我们**自动继承**；
#     · 我们的全部定制集中在本文件这一处，不会散落；
#     · 也不存在"副本悄悄过期"的问题。
#   实测合并规则（本机 compose v5.1.2 / 111 v5.5.1 均验证）：
#     · 映射字段（build.args、environment）按键合并 ⇒ 只写要改/加的键
#     · 序列字段（ports、volumes）默认**追加** ⇒ 若要替换必须用 `!override`
#     · 标量字段（image、command）覆盖
#
# ★ 容器组清单（合并后）
#     常驻（不带 profile 也启动）：
#       postgres · redis · docreader · app · frontend   ← 官方基底定义（本文件只改各自的定制项）
#       frontend-wkj                                    ← 本文件新增（定制前端，源码 my-frontend/）
#       nginx                                           ← 本文件新增（接入层）
#     按需（官方基底里 profile 门控，写进本文件也**不会**变成无条件启动）：
#       searxng / searxng-init（自带搜索）
#       neo4j（知识图谱存储）
#       ⇒ 部署脚本已把这两个 profile 并入 $DC，故实际用法上「随容器组统一启停」。
#
# ★ 对外端口
#     10443  → nginx → 官方前端（HTTPS；2026-10-15 自 443 改入：443 让位，避免 https://IP 直达知识库）
#     41200  → nginx → 官方前端
#     41280  → nginx → 定制前端
#     41201  → app（后端 API，仍是 http，未纳入 TLS）
#     41291  → searxng（自带搜索；**仅绑回环**，profile 门控）
#     41292  → neo4j Browser UI（**仅绑回环**，profile 门控）
#     41293  → neo4j Bolt（**仅绑回环**，profile 门控；供本机工具直连）
#   两个前端容器本身**只绑宿主回环** 41211 / 41212（仅供诊断），对外一律经 nginx。
#   ⇒ "没有 http 前端端口"是结构上的事实，不是约定。
#
# ★ 与官方 docker-compose.yml 的实际差异（非注释的实体改动，同步上游时按此比对）
#     1. frontend.ports           41200:80            → 127.0.0.1:41211:80（!override）
#     2. frontend.build.args      NPM_REGISTRY 默认空 → npmmirror
#     3. app.build.args           +GOPROXY_ARG / GOSUMDB_ARG
#     4. app.build.args           +VERSION_ARG / COMMIT_ID_ARG / BUILD_TIME_ARG
#     5. app.build.args           +RUSTUP_DIST_SERVER_ARG / RUSTUP_UPDATE_ROOT_ARG
#     6. app/docreader.build.args +GH_PROXY
#     7. app.build.args           +NPM_REGISTRY_ARG
#     8. app.build.args           +CARGO_REGISTRY_ARG
#     9. docreader.build.args     APT_MIRROR 默认空 → https://mirrors.tencent.com
#    10. +service frontend-wkj / +service nginx
#    11. searxng.ports             8080:8080 → 127.0.0.1:41291:8080（!override）+ SEARXNG_BASE_URL
#    12. searxng-init.volumes      官方模板 → ./my-docker/searxng/settings.yml（!override）
#    13. neo4j.ports               7474:7474 + 7687:7687 → 127.0.0.1:41292:7474
#                                  + 127.0.0.1:41293:7687（!override）
#    14. frontend-wkj.volumes       +./my-frontend/dist:/usr/share/nginx/html
#    15. docreader.volumes          +./docreader:/app/docreader:ro
#    16. app.volumes                +./.build/WeKnora:/app/WeKnora:ro
#    17. app.volumes                +./migrations:/app/migrations:ro
#   ⇒ 14–17 是**同一件事的四层**：应用代码外置（改代码不必重建镜像 / 不走国内构建链）。
#   ⇒ 用 `./deploy/deploy-wkj-dev.sh compose-diff` 可随时复核（**仅覆盖 compose 层**）。
#
# ★ 官方**源码文件**的改动（compose-diff 看不到，须用 git 比对）：
#     仅余 docker/Dockerfile.app 与 docker/Dockerfile.docreader —— 两者都是为国内网络加的
#     **中性**构建 ARG（GH_PROXY / APT_MIRROR / RUSTUP_* / CARGO_* / NPM_*；留空即回落官方行为），
#     与解析能力无关，且与 AGENTS.md「官方文件唯一例外」的声明一致。
#   ⇒ 列全官方文件改动面：`git diff --name-status upstream/main..HEAD`
#
# ★ 注意：官方 compose 里的 `${FRONTEND_PORT}` 已被第 1 条 `!override` 覆盖，
#   即 .env 中该变量的旧值（41200）**不再生效**。对外端口以本文件的 nginx 为准。
# ==============================================================================
services:

  # ──────────────────────────────────────────────────────────────── 官方前端
  frontend:
    # 让出对外端口：一个端口不能既是 http 又是 https，而 41200 要由 nginx 提供 TLS。
    # 改为只绑宿主回环（诊断可直接 curl 127.0.0.1:41211，绕过接入层）。
    ports: !override
      - "127.0.0.1:41211:80"

    build:
      args:
        # [差异 2] 官方默认空 ⇒ registry.npmjs.org（国内不可达）；默认走 npmmirror
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

  # ─────────────────────────────────────── 定制前端（源码 my-frontend/）
  # my-frontend/ 是官方 frontend/ 的**逐字副本**（已同步至官方 main `cc82e75c`，
  # `diff -r frontend my-frontend` 零差异）—— 保持逐字是为了以后与上游合并时，
  # diff 所见即"我们刻意的改动量"，没有噪声。定制全在本文件这一层。
  # ★ 每次上游同步后都要跟一次副本同步，否则上述判据会失效（2026-09-21 实测：
  #   上游一轮更新即产生 66 项差异，且全部来自官方演进）。
  frontend-wkj:
    # ★ 独立镜像 tag：绝不能与官方共用 wechatopenai/weknora-ui，
    #   否则 pull / build 会互相静默覆盖（该风险已在本脚本里针对 app/ui 处理过，这里从源头避免）。
    image: wechatopenai/weknora-ui-wkj:${WEKNORA_VERSION:-latest}
    build:
      context: ./my-frontend
      args:
        VITE_FRONTEND_COMMIT: ${VITE_FRONTEND_COMMIT:-unknown}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4096}
    container_name: WeKnora-frontend-wkj

    ports:
      # 与官方前端同样只绑回环（见上）
      - "127.0.0.1:41212:80"

    environment:
      # docker-entrypoint.sh 把这些写进 config.js 与内层 nginx 配置
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-}
      - APP_HOST=${APP_HOST:-app}
      - APP_PORT=${APP_BACKEND_PORT:-8080}
      - APP_SCHEME=${APP_SCHEME:-http}

    # 与官方 frontend 同款：同一 project 内可以声明 depends_on
    depends_on:
      app:
        condition: service_healthy

    networks:
      - WeKnora-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── 应用代码外置（2026-09-21）：静态文件改由宿主目录提供
    # 日常改前端 = 本地 `npm run build` → rsync dist 到该目录 ⇒ **立即生效**，
    # 无需重建镜像、无需重启容器（内层 nginx 直接读文件）。
    # ★ **不能加 `:ro`** —— docker-entrypoint.sh 启动时要往此目录写运行时配置
    #   `config.js`；只读挂载会让容器直接启动失败。
    # ★ 首次启用前**必须先填充**该目录（从现有容器 `docker cp` 拷一份），
    #   否则空目录 ⇒ 页面 404 —— 镜像里那份被挂载**遮住**，兜不住。
    # ★ 该目录已被 gitignore，故 `sync_code` 的 `git reset --hard` 不会动它。
    volumes:
      - ./my-frontend/dist:/usr/share/nginx/html

    restart: unless-stopped

  # ──────────────────────────────────────────────── 接入层（HTTPS/WSS 入口）
  # 两个前端的统一入口。配置资产在 my-docker/nginx/（nginx.conf、gen-certs.sh、README）。
  # 为什么需要它：BrowserSkill 配对要求非 localhost 必须走 wss
  #   —— internal/browserskill/manager.go 的 WSS 校验；上游 .env.example 的
  #      BROWSERSKILL_PUBLIC_URL 段（同样刻意不写行号，理由见下方 app 段注释）
  #   「远程部署必须使用 WSS（包括内网）」。
  nginx:
    image: nginx:1.30.3-alpine
    container_name: weknora-nginx

    ports:
      - "10443:443"     # 官方前端 HTTPS（2026-10-15 自 443 改入，避免抢占标准端口）
      - "41200:41200"   # 官方前端
      - "41280:41280"   # 定制前端

    volumes:
      - ./my-docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书只存在于宿主磁盘（不进 git）：私钥绝不能入库
      # 目录名 /mnt/data/weknora-tls 刻意保留历史名 —— 改名会让人误以为要重新生成，
      # 而重新生成会作废访问端已导入的 CA 信任。
      - /mnt/data/weknora-tls:/etc/nginx/tls:ro

    # 同 project 内可声明依赖（跨编排时做不到，这正是合并成一个容器组的收益之一）
    depends_on:
      - frontend
      - frontend-wkj

    networks:
      - WeKnora-network

    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  # ───────────────────────────────────────────── 后端：构建期站点适配（国内网络）
  app:
  # ── 应用代码外置（2026-09-22 上线）：主二进制改由宿主目录提供
  # 产出方式：用 my-docker/Dockerfile.app-builder 这个**编译镜像**编译
  #   （与 final 镜像同为 Debian 12 ⇒ glibc 一致；实测产物 GLIBC 需求 ≤2.35，
  #     容器上限 2.36），再由 `deploy-wkj-dev.sh push-app` 投递到 .build/WeKnora
  #   并重启 app。
  #   实测：首次全链路 2m02s（含 Rust anydoc 全编译）；稳态缓存命中 **15.7s**。
  # ★ 单文件挂载要求宿主文件**已存在** —— 否则 Docker 会创建同名**目录**，
  #   容器 ENTRYPOINT 直接失败。故首次启用的顺序是「**先** push-app 产出、
  #   **再** up -d app」；push-app 已内置挂载检测，会自动改走重建。
  # ★ 与官方既有的三条挂载（data-files / docreader-tmp / config.yaml）是**追加**关系。
  #
  # ── 迁移文件外置（2026-09-22）：应用代码外置的第二层，理由同上
  # 落点依据：迁移器读的是**相对路径** `file://migrations/versioned`（见
  #   internal/database/migration.go 的 RunMigrationsWithOptions），相对容器
  #   WORKDIR `/app` ⇒ 正是本挂载点，无需任何配置项。
  # 为什么必须外置：二进制是单文件外置的，而 `migrations/` 仍来自镜像
  #   ⇒ push-app 换了代码**换不到迁移** ⇒ 官方新迁移永远不生效。
  #   2026-09-22 实测踩到：容器内只到 000108，代码已含 000109，且新代码的
  #   Session 模型带该列且无 `gorm:"-"` ⇒ 列不存在会让**所有会话查询报错**。
  # 生效方式：宿主 ./migrations 由 sync_code 的 `git reset --hard` 更新
  #   ⇒ push-app 一次动作即「新二进制 + 新迁移」同时到位。
  # ★ 首次启用需 `up -d app` 重建（挂载在容器创建时固定，restart 不生效），
  #   之后 push-app 的 restart 即能读到新迁移。
  # ★ 宿主目录必须**存在且非空**：迁移器报错会被 AUTO_MIGRATE 的 warn 分支
  #   吞掉（internal/container/container.go 的 "Log warning but don't fail
  #   startup"）⇒ app 照常启动、迁移却静默不跑。镜像方式下此故障面不存在
  #   （镜像里必有文件），外置后需靠宿主目录保证。
  # ★ 回滚语义：把分支指针回退到旧提交会**同时**回退二进制与迁移目录，
  #   而数据库版本不会跟着退 ⇒ 出现「库版本 > 文件版本」。升级前先看启动
  #   日志的 Current migration version 与容器内文件名核对。
    volumes:
      - ./.build/WeKnora:/app/WeKnora:ro
      - ./migrations:/app/migrations:ro
    build:
      args:
        # 官方 compose 未 wire 这两个 ARG（Dockerfile.app 已声明）⇒ Go 会回落到
        # proxy.golang.org（国内不可达）；仓库无 vendor/，此参数是硬需求。
        - GOPROXY_ARG=${GOPROXY_ARG:-https://goproxy.cn,direct}
        - GOSUMDB_ARG=${GOSUMDB_ARG:-off}
        # 注入构建版本 → 二进制内嵌 commit，可经 GET /api/v1/system/info 的
        # commit_id 查证"111 上跑的到底是哪一版"（不必再用日志行号反推）。
        # 生效链路：这些 ARG 在 builder 阶段由 ARG 转成 ENV（见 Dockerfile.app 的 builder 段）
        #   → Makefile 里 COMMIT_ID 的赋值段取 `${COMMIT_ID:-unknown}`
        #   → 同段 LDFLAGS 的 `-X ...handler.CommitID` 写入二进制。
        # 注：此处刻意**不写行号** —— 行号会随上游插行而静默失效（2026-09-21 合并时
        #     实测 3 处引用全偏），改用段名定位。
        # 注意 .dockerignore 排除了 .git/ ⇒ VERSION 的 git describe 必然失败，
        # 只能靠 VERSION_ARG 兜底，所以必须传。值由部署脚本按当前 git 状态注入。
        - VERSION_ARG=${WKJ_BUILD_VERSION:-unknown}
        - COMMIT_ID_ARG=${WKJ_BUILD_COMMIT:-unknown}
        - BUILD_TIME_ARG=${WKJ_BUILD_TIME:-unknown}
        # Rust 工具链下载源：官方 static.rust-lang.org 本网络实测 ~36KB/s
        # （工具链约 300MB ⇒ 2 小时），国内镜像 >1MB/s（快约 50 倍）。
        # 配合 Dockerfile.app 新增的中性 ARG（留空即回落官方行为）。
        # 备选：https://mirrors.ustc.edu.cn/rust-static（rustup 路径 /rustup）
        - RUSTUP_DIST_SERVER_ARG=${RUSTUP_DIST_SERVER_ARG:-https://rsproxy.cn}
        - RUSTUP_UPDATE_ROOT_ARG=${RUSTUP_UPDATE_ROOT_ARG:-https://rsproxy.cn/rustup}
        # GitHub 访问加速前缀：直连本网络实测 0~40KB/s 且常中断
        # （release 下载报 HTTP2 错、git clone 直接失败），反代实测 ~271KB/s 且支持 git 协议。
        # 内容可信性：下载产物 sha256 与官方三方交叉验证值一致。
        # 用于本服务 browserskill 阶段的 git clone（insteadOf 改写）。
        # 备选：https://ghfast.top/
        - GH_PROXY=${GH_PROXY:-https://gh-proxy.com/}
        # browserskill 阶段 `npx --yes pnpm@… install` 用
        - NPM_REGISTRY_ARG=${NPM_REGISTRY_ARG:-https://registry.npmmirror.com}
        # browserskill / builder 阶段 cargo 编译走 sparse 索引镜像（留空即官方 crates.io）
        # 备选：sparse+https://mirrors.ustc.edu.cn/crates.io-index/
        - CARGO_REGISTRY_ARG=${CARGO_REGISTRY_ARG:-sparse+https://rsproxy.cn/index/}

  docreader:
    build:
      args:
        # ★ 取值语义（踩过一次）：Dockerfile.docreader 的 sed 替换的是**带 scheme 的 base、
        #   不含路径**，而 debian.sources 本身已带 /debian 与 /debian-security。
        #   所以只能给 `https://mirrors.tencent.com`；写成 `.../debian` 会拼成
        #   `/debian/debian` → apt 404 → 构建失败（exit 100）。
        - APT_MIRROR=${APT_MIRROR:-https://mirrors.tencent.com}
        # 本服务用于 protoc 与 grpc_health_probe 两处 release 下载（同一旋钮，见 app 段）。
        # （protoc 另有更优路径：预置到 packages/ 走 Dockerfile 自带离线分支，
        #   由部署脚本 _ensure_build_artifacts 处理）
        - GH_PROXY=${GH_PROXY:-https://gh-proxy.com/}

    # ── 应用代码外置（2026-09-21）
    # docreader 是 Python（解释型）⇒ **真·"换文件即生效"**：`sync` 更新源码后
    # `docker restart WeKnora-docreader` 即可（秒级），无需重建镜像。
    # ★ 依赖装在 `/app/.venv`，与源码目录 `/app/docreader` **分开**
    #   （Dockerfile.docreader：VIRTUAL_ENV=/app/.venv，源码 COPY 到 /app/docreader）
    #   ⇒ 挂源码**不会**遮住依赖。
    #   ⚠️ 若将来官方把依赖挪进源码目录，此挂载会遮住它 —— 届时须改回镜像内提供。
    volumes:
      - ./docreader:/app/docreader:ro

  # ───────────────────────── 自带搜索（官方已有的**可选**组件，非我们新增）
  # 官方基底已定义 searxng + searxng-init（含 cap_drop 降权，以及用 init 容器把
  # settings.yml 模板拷进命名卷、以避免密钥被写回工作区）。本段**只做一件事**：
  # 把宿主端口挪进我们的容器组号段（41200-41299，见 README 端口表）。
  #
  # ★ 下面两行的 `:-41291` 必须同步改 —— compose 的变量插值无法跨字段共享默认值。
  # ★ 本段**不声明 profiles** ⇒ 继承基底的 `[searxng, full]`，即
  #   **仍需 `--profile searxng` 才会启动**，不会因为写进本文件就变成无条件启动。
  # ★ 该端口只影响宿主侧诊断；容器之间访问走容器网络 `http://searxng:8080`，与此无关。
  searxng:
    ports: !override
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-41291}:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-41291}/

  # searxng-init：把「模板 settings.yml 的来源」换成我们自己的那一份。
  # ★ 为什么必须换（2026-09-22 实测）：官方模板启用上游全部默认引擎，而 111 在国内
  #   网络下这些引擎**全部不可达**（brave / duckduckgo / google cse / wikidata /
  #   wikipedia）⇒ 搜索返回 **0 条结果**，但 HTTP 仍是 200 —— 静默失效，看状态码会误判。
  #   我们的版本用 use_default_settings.engines.keep_only 只保留国内可达引擎
  #   （baidu / bing / sogou / quark / mojeek，实测均 200）。
  # ★ 用 `!override` 而非追加：volumes 是序列字段，默认**追加**会导致
  #   `/etc/searxng` 同时有官方与我们的两个源 —— 必须整体替换。
  # ★ 官方 docker/searxng/settings.yml **保持原样**（AGENTS.md 第 1 条）。
  searxng-init:
    volumes: !override
      - ./my-docker/searxng/settings.yml:/template/settings.yml:ro
      - searxng_config:/etc/searxng

  # ───────────────────────── 知识图谱存储（官方已有的**可选**组件，非我们新增）
  # 官方基底已定义 neo4j（镜像 / APOC 插件 / 命名卷 neo4j-data —— 卷已在基底
  # volumes 段声明完毕，本文件无需重复声明）。本段**只做一件事**：把宿主端口挪进
  # 我们的容器组号段（41200-41299），并统一只绑宿主回环（见 README 端口表）。
  #
  # ★ 本段**不声明 profiles** ⇒ 继承基底的 `[neo4j, full]`，即**仍需
  #   `--profile neo4j` 才会启动** —— 写进本文件不等于无条件启动（与 searxng 同款门控）。
  #   部署脚本已把该 profile 并入 $DC，故跟 searxng 一样随容器组统一启停。
  # ★ 容器之间访问走容器网络 `bolt://neo4j:7687`（app 的 NEO4J_URI 默认值）
  #   ⇒ 下面两个宿主端口**只服务宿主侧诊断**，与 app 的连接路径无关。
  # ★ 必须用 `!override`：官方暴露 7474+7687 两个端口，而 ports 是序列字段（默认**追加**）
  #   ⇒ 不用它就会同时留下官方的 7474/7687 两个全网段入口。
  # ★ 图谱功能的**开关不在这里**，而是 .env 的 NEO4J_ENABLE（见 .env.example 的 J 段）。
  #   容器起来 ≠ 功能开启：NEO4J_ENABLE 未设时 app 侧仍按关闭处理。
  neo4j:
    ports: !override
      - "127.0.0.1:41292:7474"   # Browser UI（浏览器访问 http://127.0.0.1:41292）
      - "127.0.0.1:41293:7687"   # Bolt（本机工具直连 bolt://127.0.0.1:41293）
