# ==============================================================================
# my-docker/searxng/settings.yml —— 站点定制的 SearXNG 配置
#
# ★ 为什么需要这份文件（而不是直接用官方 docker/searxng/settings.yml）
#   官方模板是 `use_default_settings: true`，即启用上游**全部默认引擎**。
#   而 111 在国内网络，实测默认启用的引擎**全部不可达**：
#       brave · duckduckgo · google cse · wikidata · wikipedia ⇒ 搜索返回 **0 条**
#   ⚠️ 注意失败形态是**静默的**：HTTP 仍返回 200，只是 results 为空 ——
#      光看状态码会误判成"部署成功"。判据必须是 results 非空。
#
# ★ 实测可达性（2026-09-22，111 宿主 curl，与容器同一网络出口）
#     200：baidu · cn.bing.com · sogou · so.com(360) · quark.sm.cn · mojeek
#     不可达：google · duckduckgo
#
# ★ 最终启用：**bing（第一优先，weight 2.0）· 360search（补充，1.0）**。
#   搜狗、百度、quark **均不用** —— 全部依据（含各引擎的实测数据）见下方 engines 段注释。
#   360search 是 2026-09-22 普查中新发现的可用引擎：searxng 自带 `360search.py` 模块，
#   但默认 `disabled: true`，需显式启用。
#
# ★ 生效链路：searxng-init（oneshot）把本文件拷进命名卷 searxng_config，
#   searxng 容器随后启动并读取。overlay 里已把 searxng-init 的模板挂载
#   指向本文件（`volumes: !override`）。改完重建两个容器即生效：
#     ./deploy/deploy-wkj-dev.sh up
#
# ★ server.secret_key 必须保留占位值 `ultrasecretkey` —— searxng 的 entrypoint
#   会用环境变量 SEARXNG_SECRET 就地替换它。
# ==============================================================================
use_default_settings:
  # ★ 从默认引擎集里**只保留**下列引擎（其余全部移除）。
  #   这样不可达引擎不会再来拖慢搜索（每个超时可达 6s）。
  #   清单与权重由老魏 2026-09-22 定：bing 最高优先、夸克次之；
  #   **搜狗、百度均不用**（百度见下方实测：反爬拦截）。
  engines:
    keep_only:
      - bing
      - "360search"

# 显式启用 + 权重。
# weight 参与 searxng 的结果排序（值越大越靠前；未写时默认 1.0）。
#
# ★ 实测（2026-09-22，111 直连各引擎搜索页，curl **-L** 跟随重定向；
#   判据是"能否拿到结果块"，不是状态码 —— 多个引擎是 200 但内容为反爬页）：
#
#   ✅ 可用
#     bing (cn.bing.com)  200 · 99KB  · 9 个 b_algo              ⇒ **第一优先（weight 2.0）**
#     360search (so.com)  200 · 513KB · 8 个结果块（含中文查询）  ⇒ 补充（weight 1.0）
#     sogou               200 · 996KB · 66 个结果块              ⇒ 可用，但老魏明确不用
#   ⚠️ 可用但不适合中文
#     marginalia          200 · 37KB  · 19 个结果块              ⇒ 英文小众索引
#     头条搜索            200 · 1.4MB · 结构不同（searxng 无模块）
#   ❌ 不可用（国内网络被拦）
#     baidu   返回「百度安全验证」页              ⇒ 老魏要求不用
#     quark   200 · 1.3KB 空页 + searxng 报 CAPTCHA ⇒ **已移除**
#     mojeek  「Captcha」                          startpage/qwant/yahoo/wiby 不可达
#     yandex  「Verification」                     presearch/luxxle Cloudflare 403
#     zapmeta 403 · shenma 空页 · seznam 中文结果极少
engines:
  - name: bing
    disabled: false
    weight: 2.0
    # ★ 必须显式指定 base_url：默认的 www.bing.com 在本网络不可用。
    #   官方 settings.yml 的 bing 段注释给的也是同一建议
    #   （`# base_url: https://cn.bing.com  # for instances hosted in China`）。
    base_url: https://cn.bing.com
    # 显式声明类别：官方默认定义里 bing **没有 categories 键**，
    # 不补这一行它不会进入普通（general）搜索。
    categories: [general]
  - name: "360search"
    disabled: false
    weight: 1.0

general:
  instance_name: "WeKnora SearXNG"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

server:
  secret_key: "ultrasecretkey"
  base_url: false
  image_proxy: true
  http_protocol_version: "1.0"
  method: "GET"
  # 关闭限流：WeKnora 后端要直接调 /search，不应被 IP 频控拦下。
  limiter: false
  public_instance: false

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
